; Local test PHP config for withU
; Use with: php.exe -c C:\WithU\withU\deploy\php82-local.ini -S 127.0.0.1:8080 -t C:\WithU\withU

date.timezone=Asia/Shanghai
default_charset=UTF-8
display_errors=On
error_reporting=E_ALL
log_errors=On
short_open_tag=On
memory_limit=512M
max_execution_time=0
upload_max_filesize=1024M
post_max_size=1024M

extension_dir="C:\WithU\tools\php82\ext"
extension=mbstring
extension=curl
extension=openssl
extension=mysqli
extension=pdo_mysql
extension=fileinfo
extension=gd
extension=sodium
extension=zip
extension=intl
