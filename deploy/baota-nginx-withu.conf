# withU 宝塔 / Nginx 站点配置片段
#
# 目标环境：
# - Nginx 1.28.x
# - PHP 8.2.x（推荐），PHP 7.4 可作为兼容下限
# - MySQL 5.7.x
#
# 使用方式：
# 1. 宝塔面板创建 PHP 站点，PHP 版本选择 8.2。
# 2. 网站目录指向 withU 项目根目录，例如 /www/wwwroot/withu。
# 3. 在“网站设置 -> 配置文件”中，把下面片段合并到当前 server { ... } 内。
# 4. 宝塔已自动生成 PHP fastcgi 配置时，不要重复添加 fastcgi_pass。

index index.php index.html index.htm;

# withU 以普通 PHP 文件为入口，不依赖伪静态路由。
# 这里保留不存在路径回退到首页，避免刷新或旧链接直接 404。
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 禁止访问配置、数据库结构、核心代码和构建脚本等敏感文件。
location ~* ^/(config|core|database|deploy|desktop)/ {
    deny all;
}

location ~* /\.(?:env|git|svn|hg|idea|vscode|user\.ini|htaccess) {
    deny all;
}

location ~* ^/(README\.md|LICENSE|composer\.(?:json|lock)|package(?:-lock)?\.json|pnpm-lock\.yaml)$ {
    deny all;
}

# uploads 只允许作为静态资源目录，禁止 PHP 被上传后执行。
location ~* ^/uploads/.*\.php(?:/|$) {
    deny all;
}

# 静态资源缓存。HTML / PHP 不在这里缓存，避免后台和同步观影状态过期。
location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public";
    try_files $uri =404;
}

# OpenList 直链播放和上传场景需要更大的请求体与更长的 PHP 等待时间。
# 如果只使用 OpenList 直链播放，不上传大文件，可以按需调小。
client_max_body_size 1024m;
client_body_timeout 300s;
send_timeout 300s;
fastcgi_read_timeout 300s;
fastcgi_send_timeout 300s;
