# ============================================================
# withU 宝塔 / Nginx 站点配置（frontend/ + backend/app/ 拆分版）
# 路由规则与 router.php 保持一致（二选一：php -S 内置服务器 或 Nginx）。
#
# 使用方式：
# 1. 宝塔面板创建 PHP 站点（PHP 8.2），网站目录指向 withU 项目根目录。
# 2. 网站设置 → 配置文件：用本文件内容替换宝塔默认生成的配置主体。
# 3. 下方三处站点根路径（/www/wwwroot/withU）请按实际目录调整。
# 4. 宝塔若生成的 PHP 版本片段不是 8.2，把 enable-php-82.conf 改为对应版本。
# ============================================================
index index.php index.html index.htm;

# ── 敏感文件拦截（必须位于 PHP 处理块之前） ──
location ~* ^/(config|core|database)(/|$) { deny all; }
location ~ ^/deploy/  { deny all; }
location ~ ^/scripts/ { deny all; }
location ~ ^/docs/    { deny all; }
location ~* /\.(?:env|git|svn|hg|idea|vscode|user\.ini|htaccess) { deny all; }
location ~* ^/(README\.md|LICENSE|composer\.(?:json|lock)|package(?:-lock)?\.json|pnpm-lock\.yaml)$ { deny all; }

# ── backend 内部区：只接受 rewrite 内部跳转，外部直接访问一律 404 ──
location ^~ /backend {
    internal;
    location ~ [^/]\.php$ {
        try_files $uri =404;
        include enable-php-82.conf;
    }
}

# ── 上传目录：只允许静态访问，禁止执行 PHP ──
location ^~ /uploads/ {
    alias /www/wwwroot/withU/backend/app/uploads/;
    location ~* \.php$ { deny all; }
    expires 30d;
    access_log off;
}

# ── 后台静态资源：/admin-assets/ → backend/app/assets/ ──
location ^~ /admin-assets/ {
    alias /www/wwwroot/withU/backend/app/assets/;
    location ~* \.php$ { deny all; }
    expires 30d;
    access_log off;
}

# ── 前台静态资源：/assets/ 优先 backend/app/assets（全站公共样式），
#    未命中回退 frontend/assets（与 router.php 顺序一致） ──
location ^~ /assets/ {
    root /www/wwwroot/withU;
    location ~* \.php$ { deny all; }
    try_files /backend/app$uri /frontend$uri =404;
    expires 30d;
    access_log off;
}

# ── 外部静态目录（与 router.php 一致） ──
location ^~ /ext/ {
    rewrite ^/ext/(.*)$ /frontend/_external/$1 last;
}

# ── 主路由：后台入口 → backend/app/，其余 → frontend/ ──
location / {
    if ($uri ~ ^/admin/?$) {
        rewrite ^ /backend/app/admin/index.php last;
    }
    if ($uri ~ ^/(admin|api)/.*\.php$) {
        rewrite ^/(.*)$ /backend/app/$1 last;
    }
    if ($uri ~ ^/(login|logout|install|watch|watch_play|watch_history|player|cz_player)\.php$) {
        rewrite ^/(.*)$ /backend/app/$1 last;
    }
    if ($uri ~ ^/(about|albums|articles|lovelist|messages|page|timeline|album-detail|album-detail-private|imglist)\.html$) {
        rewrite ^/([a-z\-]+)\.html$ /$1.php permanent;
    }
    rewrite ^/(?!frontend/)(.*)$ /frontend/$1 last;
}

# ── 前台 PHP 处理 ──
location ~ [^/]\.php$ {
    try_files $uri =404;
    include enable-php-82.conf;
}

# ── 大文件上传 / 长请求（直链播放、视频上传） ──
client_max_body_size 1024m;
client_body_timeout 300s;
send_timeout 300s;
fastcgi_read_timeout 300s;
fastcgi_send_timeout 300s;
