<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WithU</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; }
      #fallback {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: #8b93a7;
        font: 14px/1.6 system-ui, sans-serif;
      }
      #fallback[hidden] { display: none; }
      #fallback button {
        padding: 8px 20px;
        border: 1px solid #3a4152;
        border-radius: 8px;
        background: #1a1f2b;
        color: #d7dce6;
        cursor: pointer;
      }
      #fallback button:hover { background: #232936; }
    </style>
  </head>
  <body>
    <div id="fallback" hidden>
      <div>网络连接失败，请检查网络后重试</div>
      <button onclick="location.reload()">重新加载</button>
    </div>
    <script>
      const TARGET = "https://gzr.xjy.xn--6qq986b3xl/";
      // 探测可达后跳转；超时或失败显示本地兜底页
      const timer = setTimeout(() => {
        document.getElementById("fallback").hidden = false;
      }, 15000);
      fetch(TARGET, { mode: "no-cors" })
        .then(() => {
          clearTimeout(timer);
          location.replace(TARGET);
        })
        .catch(() => {
          clearTimeout(timer);
          document.getElementById("fallback").hidden = false;
        });
    </script>
  </body>
</html>
